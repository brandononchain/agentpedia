name: Source candidates

# Nightly refresh of data/candidates.json. This workflow checks out main and
# pushes only the candidates branch. It does not run on pull_request, so it
# never executes untrusted pull-request code and it never pushes to main.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild the candidate queue
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/sourcing/source_candidates.py

      - name: Open or update the candidates pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp data/candidates.json /tmp/candidates.json
          git fetch origin main
          if git fetch origin candidates; then
            git checkout -B candidates origin/candidates
            if ! git merge origin/main --no-edit; then
              git checkout --ours data/candidates.json || true
              git add data/candidates.json
              git commit -m "Merge main into the candidate queue" || true
            fi
          else
            git checkout -B candidates origin/main
          fi
          test "$(git branch --show-current)" = "candidates"
          cp /tmp/candidates.json data/candidates.json
          git add data/candidates.json
          if git diff --cached --quiet; then
            echo "candidate queue is unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Refresh candidate queue"
          git push origin candidates
          if gh pr view candidates --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh pr edit candidates --repo "$GITHUB_REPOSITORY" --title "Refresh candidate queue" --body "Nightly refresh of data/candidates.json. Generated by tools/sourcing/source_candidates.py. Do not hand-merge this file."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head candidates --title "Refresh candidate queue" --body "Nightly refresh of data/candidates.json. Generated by tools/sourcing/source_candidates.py. Do not hand-merge this file."
          fi
