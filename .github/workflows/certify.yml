name: Certify

# This workflow checks out and runs pull-request code. It must not be able to
# write the repository or comment as the workflow token. Comments are posted
# by certify-publish.yml, which runs from the default branch on workflow_run
# and only reads the report artifact. Result files are recorded by
# certify-record.yml, which runs only on the default branch.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint changed skills and run declared checks
        id: report
        continue-on-error: true
        run: python3 tools/certify_report.py --base origin/${{ github.base_ref || 'main' }} --out "$RUNNER_TEMP/certify.md"

      - name: Upload the report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certify-report
          path: ${{ runner.temp }}/certify.md
          if-no-files-found: ignore
          retention-days: 7

      - name: Fail the job when the report failed
        if: steps.report.outcome == 'failure'
        run: exit 1
