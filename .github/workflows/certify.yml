name: Certify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      write_results:
        description: Record passing check runs into certs/results
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint changed skills and run declared checks
        id: report
        continue-on-error: true
        run: python3 tools/certify_report.py --base origin/${{ github.base_ref || 'main' }} --out "$RUNNER_TEMP/certify.md"

      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" --body-file "$RUNNER_TEMP/certify.md"

      - name: Record passing checks
        if: steps.report.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.write_results) || contains(toJSON(github.event.pull_request.labels.*.name), 'record-checks'))
        run: python3 tools/certify_report.py --base origin/${{ github.base_ref || 'main' }} --write --out "$RUNNER_TEMP/certify-write.md"

      - name: Commit recorded results
        if: steps.report.outcome == 'success' && ((github.event_name == 'workflow_dispatch' && inputs.write_results) || contains(toJSON(github.event.pull_request.labels.*.name), 'record-checks'))
        run: |
          if git diff --quiet -- certs/results certs/records; then
            echo "No result files changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certs/results certs/records
          git commit -m "Record certification check results"
          git push

      - name: Fail the job when the report failed
        if: steps.report.outcome == 'failure'
        run: exit 1
