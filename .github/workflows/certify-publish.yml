name: Certify publish

# Runs the workflow file from the default branch, after Certify finishes.
# It does not check out the pull request and does not execute its code.
# The only input is the report artifact produced by the read-only job.

on:
  workflow_run:
    workflows: ["Certify"]
    types: [completed]

permissions:
  contents: read

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}" --jq '.pull_requests[0].number // empty')
          echo "number=${number}" >> "$GITHUB_OUTPUT"
          if [ -z "$number" ]; then
            echo "No same-repository pull request is attached to this run."
          fi

      - name: Download the report artifact
        if: steps.pr.outputs.number != ''
        uses: actions/download-artifact@v4
        with:
          name: certify-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Comment on the pull request
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          if [ ! -f certify.md ]; then
            echo "The Certify run did not upload a report."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file certify.md
