name: Catalog

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pytest
        run: python3 -m pip install pytest

      - name: skill-lint unit tests
        run: PYTHONPATH=tools/skill-lint python3 -m pytest tools/skill-lint/tests -q

      - name: Lint every published skill
        run: PYTHONPATH=tools/skill-lint python3 -m skill_lint skills

      - name: Install Node dependencies
        run: npm ci

      - name: Build the catalog and the site
        run: npm run build
